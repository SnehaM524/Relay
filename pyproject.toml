[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autopilot-growth"
version = "0.1.0"
description = "Autopilot: AI growth experimentation agent — funnel analysis, experiment proposals, React variants, flag config, and readouts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
autopilot = "autopilot.cli:main"

[tool.setuptools.packages.find]
include = ["autopilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
